base_url = "https://api.openai.com/v1"
model = "gpt-4.1-mini"
embedding_model = "text-embedding-3-small"
api_key_env = "ALIEN_HUNT_API_KEY"

# USD per million tokens. The run stops when 80% of --budget is spent.
price_input_per_mtok = 0.40
price_output_per_mtok = 1.60
price_embedding_per_mtok = 0.02

# Total prompt + completion tokens allowed inside one directed hunt.
max_tokens_per_hunt = 8000
container_image = "docker.io/library/python:3.10-slim"

# Optional: embeddings from a second endpoint with its own key (for a chat provider with no embeddings API,
# or to give the two roles two keys). Without this table, the endpoint above serves both.
# [embedding]
# base_url = "https://router.example/v1"
# model = "openai/text-embedding-3-small"
# api_key_env = "ALIEN_HUNT_EMBED_KEY"

# Sent with every chat request; `false` leaves it out, for a model that refuses it.
# temperature = 0

# The limit on one reply: a review's claims with their reproducers, or a batch of coherence ratings.
# max_output_tokens = 4000

# Candidates rated below this (1 to 5) are not hunted.
# min_coherence = 3
# Candidates in the pool (4 per co-located pair).
# sample_limit = 80
# When no candidate reaches min_coherence, the best this many rated 2 are hunted (0 turns it off).
# fallback_hunts = 3
# Tool rounds for a plain review and for a directed hunt.
# max_tool_rounds_review = 8
# max_tool_rounds_hunt = 6
# Candidates rated per coherence request.
# coherence_batch = 10
