[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alien-hunt"
version = "0.1.0"
description = "Sample defect combinations a plain review does not already produce, then confirm them."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlo Perassi" }]
keywords = ["security", "code-review", "llm", "vulnerability", "alien-space-of-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/carlok/alien-hunt"
Issues = "https://github.com/carlok/alien-hunt/issues"
Paper = "https://arxiv.org/abs/2603.01092"

[project.scripts]
alien-hunt = "alien_hunt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alien_hunt = ["data/*.json", "data/semgrep/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
